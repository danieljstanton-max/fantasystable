# Ingest is the heavy job — pulling every runner from The Racing API and
# writing them into Postgres. It runs on GitHub Actions rather than Vercel
# Cron because Vercel serverless caps out at 60s (10s on Hobby) and a big
# ingest can push past that, and because a failed ingest deserves a per-run
# log rather than a buried serverless invocation.
#
# BUDGET. Private repos get 2,000 free Actions minutes a month. The original
# schedule — racecards hourly every day, results every 15 min for ten hours
# every day — burned roughly 3,500 minutes and blew the cap mid-September,
# which silently killed ingest for four days.
#
# The game is Saturday-only, so the schedule now matches:
#   • Racecards on Thu/Fri/Sat only, three times a day. Declarations for
#     Saturday land Thursday evening and firm up through Friday; the Saturday
#     morning runs catch non-runners and late odds.
#   • Results on Saturday only, through racing hours.
#
# That is roughly 280 minutes a month — comfortably inside the cap with room
# for manual `workflow_dispatch` runs.
name: ingest

on:
  workflow_dispatch:
  schedule:
    # Racecards: 06:00, 12:00 and 18:00 UTC on Thursday, Friday, Saturday.
    - cron: "0 6,12,18 * * 4,5,6"
    # Results: every 15 minutes through Saturday racing hours (UTC — the
    # window is wide enough to cover both BST and GMT).
    - cron: "*/15 12-22 * * 6"

jobs:
  racecards:
    if: startsWith(github.event.schedule, '0 6,12,18') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Ingest racecards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: npx tsx scripts/ingest-racecards.ts

  results:
    if: startsWith(github.event.schedule, '*/15') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Ingest results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
        run: npx tsx scripts/ingest-results.ts
